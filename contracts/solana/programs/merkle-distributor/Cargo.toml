[package]
name = "merkle-distributor"
version = "0.1.0"
description = "Cumulative Merkle airdrop for SPL tokens"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "merkle_distributor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
solana-sha256-hasher = "3.1"

[dev-dependencies]
litesvm = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3.1"
solana-program-option = "3"
solana-pubkey = "3"
solana-system-interface = "2"
solana-signer = "3.0"
solana-transaction = "3.0"
solana-message = "3.1"
solana-program-pack = "3.0"
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
