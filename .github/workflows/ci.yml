name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck and test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build the web app
        run: npm run build -w @mcg/web

  e2e:
    name: End to end on Anvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm run build -w @mcg/core
      - run: forge build
        working-directory: contracts/evm
      - name: Start Anvil
        run: anvil --hardfork prague --silent &
      - run: npm run test:e2e -w @mcg/api
        env:
          ANVIL_RPC_URL: http://127.0.0.1:8545

  evm:
    name: EVM contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci

  solana:
    name: Solana program
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v1.0.2
    # GitHub points HOME at its own directory; the toolchain in the image lives under /root.
    env:
      HOME: /root
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
    defaults:
      run:
        working-directory: contracts/solana
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            /root/.cargo/registry
            contracts/solana/target
          key: anchor-${{ hashFiles('contracts/solana/Cargo.lock') }}
          restore-keys: anchor-
      - run: cargo fmt --all -- --check
      - run: anchor build
      - run: cargo test --package merkle-distributor
